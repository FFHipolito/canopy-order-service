version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: canopy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: canopy_order_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d canopy_order_db']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - canopy_network

  api:
    container_name: canopy_api
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/canopy_order_db?schema=public
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: super-secret-canopy-key-change-in-production
      JWT_EXPIRES_IN: 1d
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main.js"
    networks:
      - canopy_network

volumes:
  postgres_data:
    name: canopy_postgres_data

networks:
  canopy_network:
    name: canopy_network
    driver: bridge
